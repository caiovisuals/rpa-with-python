# Ambiente de desenvolvimento. Sobe o banco e a aplicação.
#
# Uso:
#   cp .env.example .env   # e preencha POSTGRES_PASSWORD
#   docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      # Sem valor padrão de propósito: o compose falha se o .env não existir,
      # em vez de subir um banco com senha conhecida (TASK-014).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_USER: ${POSTGRES_USER:-rpa}
      POSTGRES_DB: ${POSTGRES_DB:-rpa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpa} -d ${POSTGRES_DB:-rpa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rpa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rpa}
    volumes:
      - .:/app

volumes:
  pgdata:
