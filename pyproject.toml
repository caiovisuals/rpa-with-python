[project]
name = "rpa"
version = "0.1.0"
description = "Sistema de geração e gerenciamento de Recibo de Pagamento Autônomo (RPA)"
requires-python = ">=3.11"

# O **domínio** não tem dependência nenhuma — garantido por
# tests/architecture/test_domain_purity.py. As dependências abaixo servem à
# persistência, que é camada externa. Cada uma está justificada em
# docs/adr/0001-arquitetura-em-camadas.md.
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Aviso vira erro: a suíte não passa com SAWarning, DeprecationWarning ou
# ResourceWarning pendente. É a única forma de não conviver com eles.
filterwarnings = ["error"]
markers = [
    "fiscal: caso de cálculo derivado de parâmetro fiscal homologado",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # datetime sem timezone
    "T20",      # print esquecido
    "SIM",      # simplificações
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Migrations carregam SQL literal que não se quebra sem prejudicar a leitura e
# o diff. O limite de linha é a única regra dispensada — o resto vale.
"migrations/versions/*.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["app", "tests"]

# Migrations são scripts gerados e revisados à mão, não código de aplicação.
[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
