[project]
name = "rpa"
version = "0.1.0"
description = "Sistema de geração e gerenciamento de Recibo de Pagamento Autônomo (RPA)"
requires-python = ">=3.11"

# O domínio não tem dependência de runtime — por construção.
# Ver docs/adr/0001-arquitetura-em-camadas.md e o teste tests/architecture/.
# Bibliotecas de infraestrutura (web, ORM, PDF) só entram quando a decisão D2
# for confirmada. Ver docs/PLANEJAMENTO.md, seção 19.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "fiscal: caso de cálculo derivado de parâmetro fiscal homologado",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # datetime sem timezone
    "T20",      # print esquecido
    "SIM",      # simplificações
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
