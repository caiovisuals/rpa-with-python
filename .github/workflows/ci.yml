name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest

    # Os testes de integração rodam contra PostgreSQL de verdade. SQLite não
    # serviria: constraint de exclusão, índice parcial e gatilho não existem lá,
    # e são exatamente o que se quer verificar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rpa
          POSTGRES_PASSWORD: rpa_ci
          POSTGRES_DB: rpa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpa -d rpa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rpa:rpa_ci@localhost:5432/rpa_test
      # Sem isto, um banco indisponível faria os testes de integração serem
      # pulados e o build ficaria verde escondendo uma suíte inteira.
      RPA_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipos
        run: mypy

      - name: Testes
        run: pytest --cov=app --cov-report=term-missing

      # O domínio é o núcleo crítico (cálculo, invariantes, máquina de estados).
      # Cobertura total nele não é meta, é porta: abaixo disso o build não passa.
      - name: Cobertura do domínio
        run: coverage report --include="app/domain/*" --fail-under=100

      - name: Auditoria de dependências
        run: pip-audit --strict
