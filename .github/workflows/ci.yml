name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipos
        run: mypy

      - name: Testes
        run: pytest --cov=app --cov-report=term-missing

      # O domínio é o núcleo crítico (cálculo, invariantes, máquina de estados).
      # Cobertura total nele não é meta, é porta: abaixo disso o build não passa.
      - name: Cobertura do domínio
        run: coverage report --include="app/domain/*" --fail-under=100

      - name: Auditoria de dependências
        run: pip-audit --strict
